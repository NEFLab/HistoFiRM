[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histofirm"
version = "0.1.0"
description = "Ridge-anchored functional regression from histology feature moments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "torch>=2.1", "scikit-learn>=1.3", "h5py>=3.8"]

[project.optional-dependencies]
scoring = ["gseapy==1.3.0"]
test = ["pytest>=8"]

[project.scripts]
histofirm = "histofirm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
